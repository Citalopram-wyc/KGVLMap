<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KGVLMap · 训练与每轮精度</title>
<style>
:root{color-scheme:light;--ink:#192735;--muted:#697887;--line:#dbe3e9;--blue:#265fc2;--green:#197866}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
main{max-width:1160px;margin:auto;padding:34px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 18px}p{margin:8px 0}.muted{color:var(--muted);font-size:13px}.badge{border:1px solid var(--line);padding:5px 13px;border-radius:20px;color:var(--blue);background:white}
.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:25px;margin-top:24px}.progress-top{display:flex;justify-content:space-between;align-items:baseline}.epoch{font-size:30px;font-weight:650}.bar{background:#e7edf5;height:8px;border-radius:5px;overflow:hidden;margin:16px 0}.bar div{background:var(--blue);height:100%;transition:width .3s}.details{display:flex;gap:26px;flex-wrap:wrap;color:var(--muted);font-size:13px}.details b{color:var(--ink);font-weight:600}.notice{background:#eff5ff;color:#34547c;padding:14px 18px;border-left:3px solid var(--blue);margin:20px 0 0}.notice p{margin:0}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin-top:20px;padding:18px 0;border-top:1px solid var(--line)}.metrics strong{display:block;font-size:25px;color:var(--blue);font-variant-numeric:tabular-nums}.metrics span{font-size:13px;color:var(--muted)}.section-top{display:flex;align-items:baseline;justify-content:space-between;gap:20px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;white-space:nowrap}th,td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:13px;color:var(--muted);font-weight:600;background:#f8fafc}.best{background:#f0f7f5}.best-mark{color:var(--green);font-size:12px;margin-left:10px}svg{width:100%;height:auto;display:block}footer{padding:18px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}button{border:1px solid var(--line);background:white;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}.error{background:#fff3ef;border-color:#cb5536;color:#984027}[hidden]{display:none!important}@media(max-width:720px){main{padding:20px 14px}.panel{padding:18px}header{align-items:flex-start}.metrics{grid-template-columns:repeat(3,1fr)}.epoch{font-size:25px}.details{gap:12px}h1{font-size:23px}}
</style></head><body><main>
<header><div><h1>KGVLMap 训练与每轮精度</h1><p class="muted">合肥七类建筑功能 · 80% 可见标签 / 20% 隐藏标签</p></div><span class="badge" id="phase">读取中</span></header>
<div class="notice error" id="connection" hidden></div>
<section class="panel"><div class="progress-top"><div><span class="muted">当前训练轮次</span><div class="epoch" id="epoch">—</div></div><span id="step" class="muted">—</span></div><div class="bar"><div id="progress" style="width:0%"></div></div>
<div class="details"><span>实际 batch <b id="batch">—</b></span><span>有效 batch <b id="effective">—</b></span><span>最新损失 <b id="loss">—</b></span><span>显存峰值 <b id="memory">—</b></span><span>本次运行 <b id="elapsed">—</b></span></div>
<div class="notice" id="pending"><p>正在读取训练日志。</p></div>
<div id="latest" hidden><p class="muted" id="latest-label"></p><div class="metrics" id="metric-values"></div></div></section>
<section class="panel" id="curve-section" hidden><div class="section-top"><h2>每轮验证精度趋势</h2><span class="muted"><span style="color:var(--blue)">● OA</span>　<span style="color:var(--green)">● Macro-F1</span></span></div><svg id="curve" viewBox="0 0 1020 270" role="img" aria-label="每轮验证 OA 和 Macro-F1，纵轴为百分比"></svg></section>
<section class="panel"><div class="section-top"><h2>每轮完整验证结果</h2><button id="refresh" type="button">立即刷新</button></div><p class="muted" id="history-info"></p>
<div class="table-wrap" id="table-wrap" hidden><table><thead><tr><th>Epoch</th><th>OA (%)</th><th>Macro-P (%)</th><th>Macro-R (%)</th><th>Macro-F1 (%)</th><th>Kappa</th><th>验证耗时</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="muted">来源：每轮完整验证保存的结果。OA 包含背景；Macro 指标只对七类建筑功能取平均。Kappa 不使用百分比。</p></section>
<footer><div id="source"></div><div id="updated"></div>页面每 5 秒刷新；训练期间保留已完成轮次的精度。</footer>
</main><script>
const $=id=>document.getElementById(id),keys=['OA','Macro-P','Macro-R','Macro-F1','Kappa'];
const num=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'—';
const duration=x=>{if(!Number.isFinite(x))return '—';const m=Math.floor(x/60);return m>=60?`${Math.floor(m/60)} 小时 ${m%60} 分钟`:`${m} 分钟 ${Math.floor(x%60)} 秒`};
function drawCurve(history){if(!history.length)return;const svg=$('curve'),ns='http://www.w3.org/2000/svg';svg.replaceChildren();const add=(tag,attrs,text)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.appendChild(e);return e};const xmax=Math.max(2,...history.map(r=>r.epoch));const x=e=>64+(e-1)/(xmax-1)*920,y=v=>218-v/100*180;
add('text',{x:10,y:18,fill:'#697887','font-size':12},'精度 (%)');for(let t=0;t<=100;t+=20){add('line',{x1:64,x2:984,y1:y(t),y2:y(t),stroke:'#e3e8ed'});add('text',{x:48,y:y(t)+4,fill:'#697887','font-size':12,'text-anchor':'end'},String(t))}const ticks=new Set([1,xmax,...history.filter((_,i)=>i%Math.max(1,Math.ceil(history.length/8))===0).map(r=>r.epoch)]);ticks.forEach(t=>add('text',{x:x(t),y:239,fill:'#697887','font-size':12,'text-anchor':'middle'},String(t)));add('text',{x:524,y:264,fill:'#697887','font-size':12,'text-anchor':'middle'},'Epoch（已完成验证）');[['OA','#265fc2'],['Macro-F1','#197866']].forEach(([key,color])=>{add('polyline',{points:history.map(r=>`${x(r.epoch)},${y(r[key])}`).join(' '),fill:'none',stroke:color,'stroke-width':2});history.forEach(r=>{const c=add('circle',{cx:x(r.epoch),cy:y(r[key]),r:3,fill:color});const title=document.createElementNS(ns,'title');title.textContent=`Epoch ${r.epoch} · ${key}: ${num(r[key])}%`;c.appendChild(title)})})}
async function refresh(){try{const response=await fetch('/api/status',{cache:'no-store'});if(!response.ok)throw new Error(response.status);const d=await response.json(),s=d.current,c=d.config,h=d.history,ep=s.epoch||s.last_epoch||1,total=s.epochs||c.epochs;const phases={training:'训练中',awaiting_validation:'等待本轮完整验证',saving:'保存本轮结果',complete:'训练完成',failed:'训练出错',stopped:'训练进程已停止',initializing:'初始化中'};$('phase').textContent=phases[d.phase]||d.phase;$('epoch').textContent=`第 ${ep} / ${total||'—'} 轮`;$('step').textContent=s.update_in_epoch!==undefined?`本轮更新 ${s.update_in_epoch} / ${s.updates_per_epoch}`:'';$('progress').style.width=`${s.updates_per_epoch?Math.min(100,s.update_in_epoch/s.updates_per_epoch*100):0}%`;$('batch').textContent=c.micro_batch??'—';$('effective').textContent=c.micro_batch&&c.accumulation_steps?c.micro_batch*c.accumulation_steps:'—';$('loss').textContent=num(s.loss,5);$('memory').textContent=num(s.gpu_peak_GiB)+' GiB';$('elapsed').textContent=duration(s.elapsed_seconds);$('pending').hidden=!!h.length;if(!h.length)$('pending').textContent=`第 ${ep} 轮尚未完成完整验证，暂时没有每轮精度；验证结束后会自动显示，未产生的指标不会填为 0。`;$('latest').hidden=!h.length;if(h.length){$('latest-label').textContent=`最近完成：第 ${d.latest_validation.epoch} 轮验证 · 最佳 Macro-F1：第 ${d.best_validation.epoch} 轮（${num(d.best_validation['Macro-F1'])}%）`;$('metric-values').replaceChildren();keys.forEach(key=>{const div=document.createElement('div'),value=document.createElement('strong'),label=document.createElement('span');value.textContent=num(d.latest_validation[key],key==='Kappa'?3:2)+(key==='Kappa'?'':'%');label.textContent=key;div.append(value,label);$('metric-values').append(div)})}
$('history-info').textContent=h.length?`已完成 ${h.length} 轮完整验证；浅绿色标出 Macro-F1 最佳轮次。`:`验证结果将在每轮训练结束后，对全部 ${d.val_tiles?.toLocaleString()||'—'} 幅验证影像计算完成后加入。`;$('table-wrap').hidden=!h.length;$('rows').replaceChildren();[...h].reverse().forEach(row=>{const tr=document.createElement('tr');if(row.epoch===d.best_validation.epoch)tr.className='best';const first=document.createElement('td');first.textContent=row.epoch;if(row.epoch===d.best_validation.epoch){const badge=document.createElement('span');badge.className='best-mark';badge.textContent='最佳';first.append(badge)}tr.append(first);keys.forEach(key=>{const td=document.createElement('td');td.textContent=num(row[key],key==='Kappa'?3:2);tr.append(td)});const seconds=document.createElement('td');seconds.textContent=duration(row.validation_seconds);tr.append(seconds);$('rows').append(tr)});$('curve-section').hidden=!h.length;drawCurve(h);$('source').textContent='结果目录：'+d.run_directory;$('updated').textContent=`训练状态更新时间：${d.updated_at?.replace('T',' ')||'—'} · 页面数据：${d.refreshed_at.replace('T',' ')}`;$('connection').hidden=true;if(d.phase==='failed'){ $('connection').hidden=false;$('connection').textContent=s.error||'训练发生错误，请查看运行日志。'}}catch(error){$('connection').hidden=false;$('connection').textContent='页面暂时无法连接状态服务，已保留上次数据；这不会中断训练。'}}
$('refresh').onclick=refresh;refresh();setInterval(refresh,5000);
</script></body></html>
